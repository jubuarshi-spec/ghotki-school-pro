<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ghotki Pro</title></head>
<body style="margin:0;background:#eef2ff;font-family:Arial">

<div id="loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#061a40,#0a3d8f);display:flex;flex-direction:column;justify-content:center;align-items:center;color:white;z-index:9999">
<div style="width:60px;height:60px;border:6px solid rgba(255,255,255,.3);border-top:6px solid white;border-radius:50%;animation:spin 1s linear infinite"></div>
<h2>GHOTKI SCHOOL PRO</h2><small>By Subash Arshi</small>
</div>

<div id="onboarding" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:#061a40;padding:15px;z-index:9998">
<div style="background:white;max-width:400px;margin:20px auto;border-radius:15px;padding:20px">
<h2 style="color:#0a3d8f;text-align:center">🎓 SCHOOL REGISTRATION</h2>
<input id="schoolName" placeholder="School Name *" style="width:100%;padding:12px;margin:6px 0;border:2px solid #dce4ff;border-radius:8px">
<select id="district" style="width:100%;padding:12px;margin:6px 0;border:2px solid #dce4ff;border-radius:8px"><option>Ghotki</option><option>Sukkur</option><option>All Pakistan</option></select>
<input id="principalName" placeholder="Principal Name *" style="width:100%;padding:12px;margin:6px 0;border:2px solid #dce4ff;border-radius:8px">
<input id="principalPhone" placeholder="WhatsApp *" style="width:100%;padding:12px;margin:6px 0;border:2px solid #dce4ff;border-radius:8px">
<input id="gmail" placeholder="Gmail *" style="width:100%;padding:12px;margin:6px 0;border:2px solid #dce4ff;border-radius:8px">
<button onclick="registerSchool()" style="width:100%;padding:14px;background:#0a3d8f;color:white;border:none;border-radius:10px;font-weight:bold;margin-top:10px">ENTER MY SCHOOL</button>
</div></div>

<div id="mainApp" style="display:none">
<div style="background:linear-gradient(90deg,#0a3d8f,#00d4ff);color:white;padding:18px;text-align:center">
<h2 id="sNameShow" style="margin:0"></h2><small id="dShow"></small> | <small id="pShow"></small>
<div style="margin-top:8px"><span style="background:rgba(255,255,255,.2);padding:4px 10px;border-radius:12px">Streak <b id="streak">1</b></span> <span style="background:gold;color:black;padding:4px 10px;border-radius:12px">Rank #1 in <span id="rankD"></span></span></div>
</div>
<div style="padding:12px">
<div style="background:white;padding:12px;border-radius:10px;display:flex;gap:10px;text-align:center"><div style="flex:1"><b id="total">0</b><br>Total</div><div style="flex:1"><b id="present">0</b><br>Present</div><div style="flex:1"><b id="absent">0</b><br>Absent</div></div>
<div style="background:white;padding:15px;border-radius:10px;margin-top:12px">
<h3 style="margin:0 0 10px;color:#0a3d8f">➕ Add New Student (Full Data)</h3>
<input id="stName" placeholder="Student Name *" style="width:48%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:3px">
<input id="fName" placeholder="Father Name *" style="width:48%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:3px">
<input id="rollNo" placeholder="Roll No * 123" style="width:48%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:3px">
<select id="sClass" style="width:48%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:3px"><option value="">Class *</option><option>Class 6</option><option>Class 7</option><option>Class 8</option><option>Class 9</option><option>Class 10</option></select>
<input id="fatherPhone" placeholder="Father WhatsApp" style="width:98%;padding:11px;border:1px solid #ccc;border-radius:8px;margin:3px">
<button onclick="addStudent()" style="width:98%;padding:13px;background:#0a3d8f;color:white;border:none;border-radius:10px;font-weight:bold;margin-top:8px">+ Add Student with Full Info</button>
<table style="width:100%;margin-top:12px;border-collapse:collapse;font-size:13px"><tr style="background:#0a3d8f;color:white"><th style="padding:8px">Roll</th><th>Name</th><th>Father</th><th>Class</th><th>Status</th></tr><tbody id="list"></tbody></table>
</div></div></div>
<style>@keyframes spin{to{transform:rotate(360deg)}}</style>
<script>
setTimeout(()=>{document.getElementById('loader').style.display='none';if(localStorage.getItem('schoolRegistered')=='yes')showMain();else document.getElementById('onboarding').style.display='block';},1000);
function registerSchool(){let s=schoolName.value,d=district.value,p=principalName.value,ph=principalPhone.value,g=gmail.value;if(!s||!ph||!g){alert("Fill *");return;}localStorage.setItem('schoolName',s);localStorage.setItem('district',d);localStorage.setItem('principalName',p);localStorage.setItem('schoolRegistered','yes');onboarding.style.display='none';showMain();}
function showMain(){mainApp.style.display='block';sNameShow.innerText=localStorage.getItem('schoolName');dShow.innerText=localStorage.getItem('district');pShow.innerText=localStorage.getItem('principalName');rankD.innerText=localStorage.getItem('district');}
function addStudent(){let cur=parseInt(total.innerText);if(cur>=50){alert("Limit 50! Contact Subash");return;}let n=stName.value,f=fName.value,r=rollNo.value,c=sClass.value;if(!n||!f||!r||!c){alert("Fill all *");return;}list.innerHTML+="<tr><td style='padding:8px;border-bottom:1px solid #eee'><b>"+r+"</b></td><td style='border-bottom:1px solid #eee'>"+n+"</td><td style='border-bottom:1px solid #eee'>"+f+"</td><td style='border-bottom:1px solid #eee'>"+c+"</td><td style='border-bottom:1px solid #eee'>✅</td></tr>";total.innerText=cur+1;present.innerText=cur+1;stName.value="";fName.value="";rollNo.value="";}
</script></body></html>
